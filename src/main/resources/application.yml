spring:
  application:
    name: gitddo
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gitddo}
    username: ${DB_USERNAME:gitddo}
    password: ${DB_PASSWORD:gitddo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope:
              - read:user
              - read:org

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

gitddo:
  github:
    connect-timeout: ${GITDDO_GITHUB_CONNECT_TIMEOUT:5s}
    read-timeout: ${GITDDO_GITHUB_READ_TIMEOUT:30s}
    max-attempts: ${GITDDO_GITHUB_MAX_ATTEMPTS:3}
    retry-delay: ${GITDDO_GITHUB_RETRY_DELAY:1s}
  ai:
    mode: ${GITDDO_AI_MODE:mock}
    max-analysis-depth: ${GITDDO_AI_MAX_ANALYSIS_DEPTH:P2}
    base-url: ${GITDDO_AI_BASE_URL:}
    reports-path: ${GITDDO_AI_REPORTS_PATH:/internal/v1/portfolio-reports}
    api-key: ${GITDDO_AI_API_KEY:}
    api-key-header: ${GITDDO_AI_API_KEY_HEADER:X-Gitddo-Ai-Key}
    connect-timeout: ${GITDDO_AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${GITDDO_AI_READ_TIMEOUT:600s}
    max-attempts: ${GITDDO_AI_MAX_ATTEMPTS:3}
    retry-delay: ${GITDDO_AI_RETRY_DELAY:2s}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
